<!DOCTYPE html>
<html>
    <head>
        <title>COMMENDE</title>
        <style>
            table{
               margin: auto;
               border: 6px solid rgba(9, 102, 156, 0.642);
               width: 80%;
                border-collapse: collapse;
                color: #010904d0;
                background-color: rgba(78, 131, 192, 0.378);
            }
           td{
            width:30px;
            height:20px;
            padding:5px;
            border:1px solid rgba(55, 153, 191, 0.662);
            }
        img{
         width:100%;
         height:890%;
         object-fit: cover;
         display:block;
        }
        h1{
            margin: auto;
            text-align: center;
            color: rgba(9, 33, 138, 0.527);
            border: 3px solid rgba(15, 73, 132, 0.46);
            box-shadow: 0 0 10px rgba(9, 99, 202, 0.722);
            display: inline-block;
            margin-bottom: 30px;
        }
        body {
            background-color: rgba(52, 122, 197, 0.352);
            text-align: center;
        }
        </style>
    </head>
    <body>
    <h2>Commande:</h2>
    <!-- ✅ أضفنا method و action -->
    <form method="POST" action="commande.php" onsubmit="return Validation_order()">
        <table>
           <tr>
             <td><img src="23.jpg" alt="image"></td>
           </tr>
            <tr><td>Prix :</td><td>1800 DA
                <!-- ✅ حقل مخفي باش PHP يلقى السعر -->
                <input type="hidden" name="Prix_prod" value="1800 DA">
            </td></tr>
            <tr><td>REF :</td><td>ef117
                <!-- ✅ حقل مخفي باش PHP يلقى المرجع -->
                <input type="hidden" name="Ref_prod" value="ef117">
            </td></tr>
            <tr><td>Couleur :</td><td>
                <!-- ✅ أضفنا name="Colr_prod" -->
                <select id="couleur" name="Colr_prod" required>
                    <option value="">-- Choisir --</option>
                    <option value="blue">blue</option>
                    <option value="black">black</option>
                </select>
            </td></tr>
            <tr><td>quantite :</td><td>
                <!-- ✅ أضفنا name="Qant_prod" -->
                <input type="number" id="quantite" name="Qant_prod" required>
            </td></tr>
            <!-- ✅ العمود Vendeur_prod مطلوب في الـ DB، أضفناه مخفي -->
            <input type="hidden" name="Vendeur_prod" value="Magasin_Officiel">
            
            <tr><td colspan="2"><input type="submit" value="commander"></td></tr>
        </table>
    </form>
    <div class="nav">
        <a href="index.html">Retour à l'accueil</a> | 
        <a href="login.html">Déjà un compte ? Se connecter</a>
    </div>
</body>
